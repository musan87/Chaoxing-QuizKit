name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pyinstaller

      - name: Verify Python compilation
        shell: pwsh
        run: |
          python -m py_compile main.py tui_app.py config.py exporter.py chaoxing_client.py

      - name: Build single-file EXE
        shell: pwsh
        run: |
          .\build_exe.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME } else { $env:INPUT_TAG }
          if (-not $tag) { throw 'Release tag is empty' }

          $notesLines = @(
            '## Chaoxing-QuizKit',
            '',
            '超星学习通个人课程自测题库导出工具箱（TUI 交互界面 + 图文多格式导出）。',
            '',
            '### 主要特性',
            '- 个人课表精准识别与一键扫描自测题量',
            '- 导出前题库概览（总题量、章节、题型、难度分布）与灵活范围筛选',
            '- 支持 TXT / Markdown / Word (.docx) / PDF (.pdf) / JSON 多格式导出，可选无答案刷题版及按章节/题型拆分',
            '- 按纯课程名归档至 `out/<课程名>/`，默认每种格式仅输出 1 份文件',
            '- 默认下载题目/答案图片到本地并直接内嵌至 Word / PDF / Markdown',
            '- 可视化配置中心（快捷配置 / 完整配置 / YAML 编辑）与亮/暗主题切换（`Ctrl+T`）',
            '- 不保存账号密码或 Cookie，登录全程 HTTPS 加密传输',
            '',
            '### 使用方式',
            '下载 `Chaoxing-QuizKit.exe` 放到任意目录后双击运行即可（Windows 64 位，无需 Python 环境）。'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesFile, ($notesLines -join "`n"), [System.Text.UTF8Encoding]::new($false))

          $ErrorActionPreference = 'Continue'
          gh release view $tag 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'

          if ($exists) {
            gh release upload $tag .\dist\Chaoxing-QuizKit.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false --title "Chaoxing-QuizKit $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag .\dist\Chaoxing-QuizKit.exe --title "Chaoxing-QuizKit $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
